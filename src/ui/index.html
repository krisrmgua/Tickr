<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickr</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="pastel">
    <div id="app">
      <header class="top">
        <div>
          <div class="brand">Tickr</div>
          <div class="sub" id="status-line">Waiting for Yahoo quote…</div>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="stocks">Stocks</button>
          <button class="tab hidden" data-tab="positions" id="tab-positions">Positions</button>
          <button class="tab" data-tab="settings">Settings</button>
        </div>
      </header>

      <main>
        <section id="view-stocks" class="view active">
          <form id="add-form" class="add-row" autocomplete="off">
            <input id="add-input" placeholder="Add ticker (AAPL, MSFT, ^GSPC)" spellcheck="false" />
            <button type="submit" class="primary">Add</button>
          </form>
          <p class="hint" id="add-hint"></p>
          <div id="stock-error" class="warn hidden"></div>
          <div id="stock-list"></div>
        </section>

        <section id="view-positions" class="view"></section>

        <section id="view-settings" class="view">
          <div class="card settings">
            <h3 id="bar-heading">Menu bar</h3>
            <label class="row"><input type="checkbox" id="p-rotate" /> Rotate one at a time</label>
            <label class="field indent" id="row-rotate-interval">
              Rotate every
              <select id="p-rotate-interval"></select>
            </label>
            <label class="row"><input type="checkbox" id="p-stack" /> Stack two tickers</label>
            <label class="row mac-only"><input type="checkbox" id="p-scroll" /> Scroll tickers</label>
            <div id="scroll-opts" class="indent mac-only">
              <label class="field">Scroll width <select id="p-scroll-width"></select></label>
              <label class="field">Scroll speed <select id="p-scroll-speed"></select></label>
              <label class="field">Scroll direction <select id="p-scroll-direction"></select></label>
            </div>
            <label class="row"><input type="checkbox" id="p-pastel" /> Pastel colors</label>
            <label class="row mac-only"><input type="checkbox" id="p-color-title" /> Color the menu-bar price</label>
            <label class="row"><input type="checkbox" id="p-login" /> Open at login</label>
            <p class="note" id="bar-note"></p>
          </div>

          <div class="card settings">
            <h3>Dailystocker</h3>
            <p class="note">
              Dashboard address (https) and the API key. One key covers futures and options.
              Leave the key blank to keep the stored one. Clear the address to hide positions.
            </p>
            <form id="ds-form" class="form" autocomplete="off">
              <label>
                Address
                <input id="ds-url" placeholder="https://example.com" spellcheck="false" />
              </label>
              <label>
                API key
                <input id="ds-key" type="password" placeholder="paste key" />
              </label>
              <div class="actions">
                <button type="submit" class="primary">Save</button>
              </div>
              <p class="hint" id="ds-hint"></p>
            </form>
          </div>
        </section>
      </main>

      <footer class="foot">
        <button type="button" class="ghost" id="btn-refresh">Refresh</button>
        <button type="button" class="ghost" id="btn-quit">Quit Tickr</button>
      </footer>
    </div>

    <div id="confirm" class="confirm hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="confirm-card">
        <h2 id="confirm-title">Confirm</h2>
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button type="button" class="ghost" id="confirm-cancel">Cancel</button>
          <button type="button" class="primary" id="confirm-ok">Confirm</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
